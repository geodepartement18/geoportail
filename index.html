<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Sentiers du Cher · PDIPR</title>

  <!-- Polices -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />

  <!-- ArcGIS Maps SDK for JavaScript -->
  <link rel="stylesheet" href="https://js.arcgis.com/4.31/esri/themes/light/main.css" />
  <script src="https://js.arcgis.com/4.31/"></script>

  <!-- Calcite Design System -->
  <script type="module" src="https://js.arcgis.com/calcite-components/3.1.0/calcite.esm.js"></script>
  <link rel="stylesheet" href="https://js.arcgis.com/calcite-components/3.1.0/calcite.css" />

  <link rel="stylesheet" href="./css/style.css" />
</head>
<body class="calcite-mode-light">

  <calcite-shell content-behind>

    <!-- ===== EN-TÊTE ===== -->
    <calcite-navigation slot="header" id="appHeader">
      <calcite-navigation-logo
        slot="logo"
        heading="Sentiers du Cher"
        description="PDIPR · Randonnée pédestre, vélo &amp; cheval"
        thumbnail="">
      </calcite-navigation-logo>
      <calcite-action-pad slot="content-end" layout="horizontal" expand-disabled class="header-actions">
        <calcite-action id="action-locate" icon="map-pin" text="Me localiser" scale="m"></calcite-action>
        <calcite-action id="action-home" icon="home" text="Étendue initiale" scale="m"></calcite-action>
        <calcite-action id="action-table" icon="table" text="Table attributaire" scale="m"></calcite-action>
        <calcite-action id="action-print" icon="print" text="Imprimer la carte" scale="m"></calcite-action>
      </calcite-action-pad>
    </calcite-navigation>

    <!-- ===== PANNEAU LATÉRAL GAUCHE : exploration ===== -->
    <calcite-shell-panel slot="panel-start" position="start" resizable width-scale="l" id="startPanel">
      <calcite-panel heading="Explorer les itinéraires">

        <div class="panel-section" id="searchWrap">
          <div id="searchContainer"></div>
        </div>

        <calcite-block heading="Filtrer les itinéraires" collapsible open icon-start="filter" class="panel-section">
          <calcite-label>Pratique
            <calcite-select id="filterPratique">
              <calcite-option value="">Toutes les pratiques</calcite-option>
            </calcite-select>
          </calcite-label>
          <calcite-label>Type d'itinéraire
            <calcite-select id="filterType">
              <calcite-option value="">Tous les types</calcite-option>
            </calcite-select>
          </calcite-label>
          <calcite-label>État de l'itinéraire
            <calcite-select id="filterEtat">
              <calcite-option value="">Tous les états</calcite-option>
            </calcite-select>
          </calcite-label>
          <calcite-button id="resetFilters" appearance="outline" width="full" icon-start="reset" scale="s">
            Réinitialiser les filtres
          </calcite-button>
        </calcite-block>

        <calcite-block heading="Légende" collapsible open icon-start="legend" class="panel-section">
          <div id="legendContainer"></div>
        </calcite-block>

        <calcite-block heading="Itinéraires trouvés" collapsible open icon-start="list" class="panel-section" id="resultsBlock">
          <calcite-notice id="resultsCount" open kind="brand" icon="hiking" class="results-notice">
            <div slot="message">Chargement des itinéraires…</div>
          </calcite-notice>
          <calcite-list id="trailList" selection-appearance="border" selection-mode="single"></calcite-list>
        </calcite-block>

      </calcite-panel>
    </calcite-shell-panel>

    <!-- ===== CARTE ===== -->
    <div id="viewDiv">
      <div id="tableDrawer" class="table-drawer">
        <calcite-panel heading="Table attributaire des itinéraires" closable id="tablePanel">
          <calcite-action slot="header-actions-end" id="closeTable" icon="x" text="Fermer"></calcite-action>
          <div id="featureTableContainer"></div>
        </calcite-panel>
      </div>
    </div>

    <!-- ===== PIED DE PAGE ===== -->
    <calcite-shell-panel slot="footer" position="start" class="app-footer">
      <span class="footer-text">Données : PDIPR du Cher, publiées sur ArcGIS Online. Application développée avec l'ArcGIS Maps SDK for JavaScript et Calcite Design System.</span>
    </calcite-shell-panel>

  </calcite-shell>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
