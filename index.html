<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Portail Open Data</title>        
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

        <script type="module" blocking="render" src="https://js.arcgis.com/calcite-components/5.1"></script>

        <link rel="stylesheet" href="https://js.arcgis.com/4.34/esri/themes/light/main.css">
        <script src="https://js.arcgis.com/4.34/"></script>
        
        <link rel="stylesheet" href="css/style.css">
   </head>
    <body>
        <main>
            <div id="loader" class="text-center py-5">
                <div class="spinner-border text-primary" role="status"></div>
                <div class="mt-2">Chargement du catalogue…</div>
            </div>
        </main>

    <calcite-shell>
      <calcite-navigation slot="header">
        <calcite-navigation-logo
          id="nav-logo"
          slot="logo"
          heading="Access ArcGIS portal items using OAuth 2.0"
          description="Use OAuth to log in to an ArcGIS Organization to view your items."
        >
        </calcite-navigation-logo>
      </calcite-navigation>
      <calcite-panel id="item-panel">
        <div id="item-gallery"></div>
      </calcite-panel>
    </calcite-shell>

        
        <script type="module" src="js/app.js"></script>
    </body>
</html>
